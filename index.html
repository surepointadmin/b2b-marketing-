async function open_(code){
 const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
 const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 try{localStorage.setItem('sp_b2b_code',code)}catch(e){}
 document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('m');
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='';try{await open_(document.getElementById('c').value.trim());}catch(err){m.textContent='팀 코드가 맞지 않아요.';b.disabled=false;}};
(async()=>{let s='';try{s=localStorage.getItem('sp_b2b_code')||''}catch(e){}if(s){b.disabled=true;m.textContent='';try{await open_(s);}catch(e){b.disabled=false;}}})();
